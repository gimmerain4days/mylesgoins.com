---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <time class="post-meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>

  {{ content }}

  <div class="post-footer">
    <a href="{{ '/writing/' | relative_url }}">&larr; All writing</a>
  </div>
</article>
